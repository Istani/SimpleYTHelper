# defender833 deployment: every application service has a stable, directly
# reachable WireGuard-LAN address. Do not publish host ports for these services.
# Keep secrets in the host-local .env only.
services:
  web:
    # The user-facing HTTP service listens directly on its dedicated WireGuard IP.
    # No Docker host port is published.
    environment:
      PORT: "80"
      DISCORD_ADAPTER_INTERNAL_URL: "http://discord-adapter:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/api/health"]
    ports: !reset []
    networks:
      edge:
        ipv4_address: ${SIMPLEYTH_WEB_WG_IP:-10.10.13.10}

  discord-adapter:
    # This service also listens directly on its dedicated WireGuard address.
    # Its management endpoint remains Bearer-authenticated.
    environment:
      PORT: "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/healthz"]
    ports: !reset []
    networks:
      edge:
        ipv4_address: ${SIMPLEYTH_DISCORD_ADAPTER_WG_IP:-10.10.13.11}
      internal: {}

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:-wireguard_net}
