# defender833 deployment: every application service has a stable, directly
# reachable WireGuard-LAN address. Do not publish host ports for these services.
# Keep secrets in the host-local .env only.
services:
  web:
    ports: !reset []
    networks:
      edge:
        ipv4_address: ${SIMPLEYTH_WEB_WG_IP:-10.10.13.10}

  discord-adapter:
    ports: !reset []
    networks:
      edge:
        ipv4_address: ${SIMPLEYTH_DISCORD_ADAPTER_WG_IP:-10.10.13.11}
      internal: {}

networks:
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:-wireguard_net}
