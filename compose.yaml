name: simpleyth-modernization

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      WEB_AUTH_SECRET: ${WEB_AUTH_SECRET:?Set WEB_AUTH_SECRET outside Git (at least 32 characters).}
      WEB_USERS_JSON: ${WEB_USERS_JSON:?Set WEB_USERS_JSON outside Git.}
      WEB_COOKIE_SECURE: ${WEB_COOKIE_SECURE:-true}
    ports:
      - "${WEB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    networks:
      - edge

  discord-adapter:
    build:
      context: .
      dockerfile: Dockerfile.discord-adapter
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL outside Git.}
      INTERNAL_ADAPTER_TOKEN: ${INTERNAL_ADAPTER_TOKEN:?Set INTERNAL_ADAPTER_TOKEN outside Git.}
      PORT: 3000
    ports:
      - "${DISCORD_ADAPTER_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    restart: unless-stopped
    networks:
      - internal
      - edge

  postgres:
    image: postgres:16.11-alpine
    profiles:
      - local-smoke
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside Git before starting Compose.}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internal

networks:
  edge:
  internal:
    internal: true

volumes:
  postgres-data:
