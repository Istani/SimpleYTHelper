name: simpleyth-modernization

services:
  postgres:
    image: postgres:16.11-alpine
    profiles:
      - local-smoke
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD outside Git before starting Compose.}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - internal

networks:
  internal:
    internal: true

volumes:
  postgres-data:
